    <script>
      // Buffers the native Android app's auto-delivered FCM token if it
      // arrives before the JS bundle loads — src/lib/nativeApp.ts replaces
      // this stub and drains __earlyFcmToken as soon as it executes.
      window.onFcmTokenReceived = function (token) {
        window.__earlyFcmToken = token;
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
